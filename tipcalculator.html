<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        h1{
            text-align: center;
            margin-top: 50px;
        }
        .tip-calculator{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        label{
            font-size: 18px;
        }
        input{
            font-size: 18px;
            padding: 5px;
            margin: 10px;
        }
        button{
            font-size: 18px;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #0011ff;
            color: white;
            border: none;
        }
        #result{
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Tip Calculator</h1>
    <div class="tip-calculator">
        <label for="billAmount">Bill Amount:</label>
        <input type="number" id="billAmount" placeholder="Enter bill amount"><br>
        <label for="tipPercentage">Tip Percentage:</label>
        <input type="number" id="tipPercentage" placeholder="Enter tip percentage"><br>
        <button id="calculateTip">Calculate Tip</button>
        <div id="result"></div>
    </div>
    <script>
        const calculateTipButton = document.getElementById('calculateTip');
        const billAmountInput = document.getElementById('billAmount');
        const tipPercentageInput = document.getElementById('tipPercentage');
        const resultDiv = document.getElementById('result');
        calculateTipButton.addEventListener('click', () => {
            const billAmount = parseFloat(billAmountInput.value);
            const tipPercentage = parseFloat(tipPercentageInput.value);

            if (isNaN(billAmount) || isNaN(tipPercentage)) {
                resultDiv.textContent = 'Please enter valid numbers for bill amount and tip percentage.';
                return;
            }

            const tipAmount = (billAmount * tipPercentage) / 100;
            const totalAmount = billAmount + tipAmount;

            resultDiv.textContent = `Tip Amount: $${tipAmount.toFixed(2)}, Total Amount: $${totalAmount.toFixed(2)}`;
        });
    </script>
</body>
</html>
